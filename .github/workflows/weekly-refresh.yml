name: Weekly law refresh

# law.go.kr 가 해외 IP(GitHub 서버)를 막아서 예약 실행은 늘 실패했다.
# 자동 갱신은 국내 IP 컴퓨터에서 scripts/auto_update.sh 로 한다. 여기는 수동 실행만 남겨 둔다.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Refresh matched laws
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python scripts/refresh_laws.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.json docs/previous_index.json docs/meta.json docs/m?.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh 법령 매칭 데이터 $(date -u +%Y-%m-%d)"
            git push
          fi
