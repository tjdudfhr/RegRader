<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RegRader · 시행 임박 법령</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* 색상은 메인(index.html)과 같은 변수를 쓴다. 다크 모드도 메인과 같은 방식(시스템 설정)을 따른다. */
  :root {
    --primary: #667eea;
    --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
    --text-primary: #1a202c;
    --text-secondary: #4a5568;
    --text-muted: #718096;
    --bg-primary: #f7fafc;
    --bg-card: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.7);
    --border: #e2e8f0;
    --chip: #edf2f7;
    --urgent: #e53e3e;  --urgent-bg: rgba(229, 62, 62, 0.10);
    --soon: #dd6b20;    --soon-bg: rgba(221, 107, 32, 0.10);
    --later: #805ad5;   --later-bg: rgba(128, 90, 213, 0.10);
    --done: #38a169;    --done-bg: rgba(56, 161, 105, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #f7fafc;
      --text-secondary: #e2e8f0;
      --text-muted: #a0aec0;
      --bg-primary: #1a202c;
      --bg-card: #2d3748;
      --bg-glass: rgba(45, 55, 72, 0.45);
      --border: #4a5568;
      --chip: rgba(255, 255, 255, 0.08);
      --urgent: #fc8181;  --urgent-bg: rgba(252, 129, 129, 0.14);
      --soon: #f6ad55;    --soon-bg: rgba(246, 173, 85, 0.14);
      --later: #b794f4;   --later-bg: rgba(183, 148, 244, 0.14);
      --done: #68d391;    --done-bg: rgba(104, 211, 145, 0.14);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg-primary);
    background-image: radial-gradient(circle at 25% 25%, #667eea22 0%, transparent 50%),
                      radial-gradient(circle at 75% 75%, #f093fb22 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--text-primary);
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .glass {
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--glass-shadow);
  }

  header {
    background: var(--primary-gradient);
    color: #fff;
    border-radius: 24px;
    padding: 22px 24px 20px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    margin-bottom: 18px;
  }
  header a.back { color: #fff; opacity: .85; text-decoration: none; font-size: .88rem; }
  header a.back:hover { opacity: 1; }
  header h1 { margin: 8px 0 4px; font-size: 1.65rem; font-weight: 800; letter-spacing: -0.01em; }
  header p { opacity: .9; font-size: .9rem; }

  /* 긴급도 요약 */
  .tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .tier { padding: 14px 16px; position: relative; overflow: hidden; }
  .tier::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--primary)); }
  .tier b { display: block; font-size: 1.9rem; font-weight: 800; color: var(--c, var(--text-primary)); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tier span { color: var(--text-muted); font-size: .82rem; font-weight: 500; }
  .tier.urgent { --c: var(--urgent); }
  .tier.soon { --c: var(--soon); }
  .tier.later { --c: var(--later); }
  .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--urgent); margin-left: 6px; vertical-align: middle; animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229, 62, 62, .55); } 100% { box-shadow: 0 0 0 10px rgba(229, 62, 62, 0); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  /* 탭: 메인의 main-tab 과 같은 모양 */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 6px; margin-bottom: 12px; }
  .tab {
    border: 1px solid transparent; background: transparent; color: var(--text-secondary);
    border-radius: 12px; padding: 11px 8px; font: 600 .95rem 'Inter', -apple-system, sans-serif; cursor: pointer;
    transition: all .25s ease;
  }
  .tab:hover { background: var(--chip); }
  .tab.on { background: var(--primary-gradient); color: #fff; border-color: var(--primary); box-shadow: 0 4px 16px rgba(102, 126, 234, .3); }
  .tab .n { font-size: .78rem; opacity: .8; margin-left: 4px; font-weight: 500; }

  .searchrow { display: flex; gap: 8px; align-items: stretch; margin-bottom: 16px; }
  .searchrow .search { margin-bottom: 0; flex: 1; min-width: 0; }
  .risk-toggle { border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); border-radius: 12px; padding: 0 14px; font: 700 .85rem 'Inter', -apple-system, sans-serif; cursor: pointer; white-space: nowrap; }
  .risk-toggle[aria-pressed="true"] { background: var(--urgent-bg); border-color: var(--urgent); color: var(--urgent); }
  .rb { font-size: .72rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; }
  .rb.pen { color: #c53030; background: rgba(229,62,62,.12); } .rb.fine { color: #c05621; background: rgba(221,107,32,.13); }
  .rb.sur { color: #975a16; background: rgba(214,158,46,.18); } .rb.san { color: #6b46c1; background: rgba(128,90,213,.13); }
  .rb.duty { color: #2c7a7b; background: rgba(56,178,172,.15); } .rb.new { color: #2b6cb0; background: rgba(66,153,225,.13); }
  .rb.del { color: #4a5568; background: rgba(160,174,192,.22); }
  @media (prefers-color-scheme: dark) { .rb.pen{color:#feb2b2} .rb.fine{color:#fbd38d} .rb.sur{color:#faf089} .rb.san{color:#d6bcfa} .rb.duty{color:#81e6d9} .rb.new{color:#90cdf4} .rb.del{color:#cbd5e0} }
  @media (max-width: 640px) { .searchrow { flex-direction: column; } .risk-toggle { padding: 10px 14px; } }
  .search {
    width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-primary); font: 400 .95rem 'Inter', -apple-system, sans-serif; margin-bottom: 16px;
  }
  .search:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

  .section-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1rem; margin: 18px 4px 10px; }
  .section-title .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .section-title .cnt { color: var(--text-muted); font-weight: 500; font-size: .88rem; }

  .card { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 14px 16px; margin-bottom: 10px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, transparent); }
  .card.urgent { --c: var(--urgent); }
  .card.soon { --c: var(--soon); }
  .card.later { --c: var(--later); }
  .card.done { --c: var(--done); }
  .title { font-weight: 700; font-size: 1.02rem; }
  .meta { color: var(--text-muted); font-size: .83rem; }
  .dday {
    grid-row: 1 / span 2; grid-column: 2; align-self: start; text-align: center; min-width: 74px;
    padding: 6px 10px; border-radius: 12px; background: var(--cbg, var(--chip)); color: var(--c, var(--text-secondary));
  }
  .dday b { display: block; font-size: 1.25rem; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .dday small { font-size: .72rem; font-weight: 600; }
  .card.urgent .dday { --cbg: var(--urgent-bg); }
  .card.soon .dday { --cbg: var(--soon-bg); }
  .card.later .dday { --cbg: var(--later-bg); }
  .card.done .dday { --cbg: var(--done-bg); }
  .rest { grid-column: 1 / -1; }
  .card[data-key] { cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
  .card[data-key]:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(31, 38, 135, .22); }
  .card[data-key]:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  /* 메인 페이지의 법령 상세 팝업을 그대로 띄우는 투명 iframe (평소에는 숨김) */
  #rr-popup { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; z-index: 9999; visibility: hidden; pointer-events: none; }
  #rr-popup.open { visibility: visible; pointer-events: auto; }
  body.rr-loading, body.rr-loading .card { cursor: progress; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .badge { font-size: .75rem; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--text-secondary); font-weight: 500; }
  .badge.new { background: var(--urgent-bg); color: var(--urgent); font-weight: 700; }
  .cat { color: #fff; font-weight: 600; }
  .tl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tl span { font-size: .74rem; border: 1px solid var(--border); border-radius: 8px; padding: 2px 7px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .tl span.now { border-color: var(--primary); color: var(--primary); font-weight: 600; }
  .tl span.future { border-style: dashed; }
  .empty { text-align: center; color: var(--text-muted); padding: 40px 16px; }
  .note { color: var(--text-muted); font-size: .8rem; margin: 18px 4px 30px; }
  .note a { color: var(--primary); }


  /* 직무별 시행예정 분석 */
  .an { padding: 16px 18px 18px; margin-bottom: 18px; }
  .an-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .an-head h2 { font-size: 1.08rem; font-weight: 800; }
  .an-sub { color: var(--text-muted); font-size: .82rem; }
  .an-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.6fr); gap: 14px; margin-bottom: 14px; }
  .an-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; min-width: 0; }
  .an-t { font-weight: 700; font-size: .9rem; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .an-t small { font-weight: 500; color: var(--text-muted); font-size: .76rem; }
  .donut-wrap { position: relative; height: 190px; }
  .donut-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .donut-c b { font-size: 1.7rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .donut-c span { font-size: .75rem; color: var(--text-muted); }
  .an-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 12px; }
  .lg { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--text-secondary); background: none; border: 0; padding: 3px 4px; border-radius: 6px; cursor: pointer; text-align: left; font-family: inherit; }
  .lg:hover, .lg.on { background: var(--chip); }
  .lg i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .lg b { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .key { display: inline-flex; gap: 10px; font-weight: 500; font-size: .74rem; color: var(--text-muted); margin-left: auto; }
  .key span { display: inline-flex; align-items: center; gap: 4px; }
  .key i { width: 9px; height: 9px; border-radius: 3px; }
  .jr { display: grid; grid-template-columns: 70px minmax(0, 1fr) 34px minmax(0, 1.25fr); align-items: center; gap: 10px; width: 100%;
        padding: 7px 6px; border: 0; border-radius: 8px; background: none; color: inherit; font-family: inherit; text-align: left; cursor: pointer; }
  .jr:hover, .jr.on { background: var(--chip); }
  .jr .nm { display: flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
  .jr .nm i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .jr .bar { display: flex; gap: 2px; height: 12px; }
  .jr .bar span { border-radius: 4px; min-width: 4px; }
  .jr .n { font-weight: 800; font-size: .9rem; text-align: right; font-variant-numeric: tabular-nums; }
  .jr .nx { font-size: .76rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jr .nx b { color: var(--text-secondary); font-variant-numeric: tabular-nums; margin-right: 4px; }
  .jr .nx b.u { color: var(--urgent); }
  .jr .nx b.s { color: var(--soon); }
  .jfilter { display: none; align-items: center; gap: 8px; margin: -6px 0 12px; font-size: .84rem; color: var(--text-secondary); }
  .jfilter.on { display: flex; }
  .jfilter .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 999px; color: #fff; font-weight: 700; }
  .jfilter button { border: 0; background: rgba(255,255,255,.25); color: #fff; border-radius: 999px; width: 20px; height: 20px; cursor: pointer; font-size: .8rem; line-height: 1; }
  @media (max-width: 760px) {
    .an-grid { grid-template-columns: 1fr; }
    .jr { grid-template-columns: 64px minmax(0, 1fr) 30px; }
    .jr .nx { grid-column: 1 / -1; padding-left: 15px; }
  }
  @media (max-width: 640px) {
    header h1 { font-size: 1.35rem; }
    .tiers { grid-template-columns: repeat(2, 1fr); }
    .tabs { grid-template-columns: repeat(2, 1fr); }
    .dday { min-width: 62px; padding: 5px 8px; }
    .dday b { font-size: 1.1rem; }
  }
</style>
<script>
  /* ?embed=1 : 메인 페이지의 탭 안에 끼워 넣어 보여줄 때 (제목 줄·메인으로 링크를 숨기고, 높이를 메인에 알린다) */
  (function () {
    if (new URLSearchParams(location.search).get('embed') === '1' && window.parent !== window) {
      document.documentElement.classList.add('rr-embedded');
      window.RR_EMBEDDED = true;
    }
  })();
</script>
<style>
  html.rr-embedded body { background: transparent !important; background-image: none !important; min-height: 0 !important; }
  html.rr-embedded .wrap { max-width: none; padding: 0; }
  html.rr-embedded header { background: none; color: var(--text-primary); box-shadow: none; padding: 0 0 14px; margin-bottom: 8px; border-radius: 0; }
  html.rr-embedded header a.back { display: none; }
  html.rr-embedded header h1 { margin-top: 0; font-size: 1.4rem; color: var(--text-primary); }
  html.rr-embedded header p { color: var(--text-muted); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./">← RegRader 메인으로</a>
    <h1>⏰ 시행 임박 법령</h1>
    <p id="asof">불러오는 중…</p>
  </header>

  <div class="tiers">
    <div class="tier glass urgent"><b id="t-urgent">–</b><span>7일 이내 시행 (긴급)</span></div>
    <div class="tier glass soon"><b id="t-soon">–</b><span>8~30일 이내 시행</span></div>
    <div class="tier glass later"><b id="t-later">–</b><span>시행예정 전체</span></div>
    <div class="tier glass"><b id="t-all">–</b><span>당사 적용 개정</span></div>
  </div>


  <section class="an glass" id="an" hidden>
    <div class="an-head"><h2>📊 직무별 시행예정 분석</h2><span class="an-sub" id="an-sub"></span></div>
    <div class="an-grid">
      <div class="an-box">
        <div class="an-t">직무별 비중</div>
        <div class="donut-wrap"><canvas id="c-donut" aria-label="직무별 시행예정 비중"></canvas><div class="donut-c"><b id="an-total">–</b><span>시행예정</span></div></div>
        <div class="an-legend" id="an-legend"></div>
      </div>
      <div class="an-box">
        <div class="an-t">직무별 긴급도 · 가장 가까운 시행
          <span class="key"><span><i style="background:var(--urgent)"></i>7일 이내</span><span><i style="background:var(--soon)"></i>8~30일</span><span><i style="background:var(--later)"></i>31일 이후</span></span>
        </div>
        <div id="an-rows"></div>
      </div>
    </div>
    <div class="an-box">
      <div class="an-t">월별 시행 예정 <small>직무별로 쌓아 보기 · 막대나 직무를 누르면 아래 목록이 그 직무로 좁혀집니다</small></div>
      <div style="height:220px"><canvas id="c-month" aria-label="월별 직무별 시행 예정"></canvas></div>
    </div>
  </section>

  <nav class="tabs glass">
    <button class="tab on" data-tab="d30">30일 내 시행<span class="n" id="n-d30"></span></button>
    <button class="tab" data-tab="multi">복수개정<span class="n" id="n-multi"></span></button>
    <button class="tab" data-tab="diff">최근 변경<span class="n" id="n-diff"></span></button>
    <button class="tab" data-tab="all">전체<span class="n" id="n-all"></span></button>
  </nav>

  <div class="searchrow">
    <input class="search" id="q" type="search" placeholder="법령명 · 부처 · 직무 검색">
    <button type="button" class="risk-toggle" id="risk-only" aria-pressed="false" title="벌칙·과태료·과징금·행정처분·의무 조항이 신설되거나 바뀐 개정만 보기">⚠️ 벌칙·과태료·의무 변경만</button>
  </div>
  <div class="jfilter" id="jfilter"></div>
  <div id="list"></div>

  <p class="note">
    남은 날은 한국 시간 오늘 기준입니다. <b>최근 변경</b>은 직전 자동 갱신과 비교한 결과이고, 날짜별 기록은 <a href="./history.html">업데이트 내역</a>에서 볼 수 있습니다.
  </p>
</div>

<script>
const TODAY = (() => { const k = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' })); return new Date(k.getFullYear(), k.getMonth(), k.getDate()); })();
let DATA = { items: [] }, PREV = { items: [] }, TAB = 'd30', JOB = null, RISK_ONLY = false;
/* 개정 표시(벌칙·과태료·과징금·행정처분·조문 신설·의무·삭제): amend_flags.json (scripts/amend_details.py) */
let AMEND = {};
const AM_META = { '벌칙': 'pen', '과태료': 'fine', '과징금': 'sur', '처분': 'san', '의무': 'duty', '신설': 'new', '삭제': 'del' };
const AM_LABEL = { '처분': '행정처분', '신설': '조문 신설', '삭제': '조문 삭제' };
const AM_RISK = ['벌칙', '과태료', '과징금', '처분', '의무'];
function amKey(it) { const a = it.amendmentType === '일부개정' ? '일' : it.amendmentType === '타법개정' ? '타' : (it.amendmentType || ''); return it.title + '|' + it.effectiveDate + '|' + a; }
function amCodes(it) { const c = AMEND[amKey(it)] || []; return Object.keys(AM_META).filter(k => c.includes(k)); }
function amRisk(it) { return amCodes(it).some(c => AM_RISK.includes(c)); }
function amBadges(it) { return amCodes(it).map(c => `<span class="rb ${AM_META[c]}">${AM_LABEL[c] || c}</span>`).join(''); }
const $ = s => document.querySelector(s);
/* 직무 색: 메인(index.html head 의 rrCatColor)과 같은 검증 팔레트 */
const CAT_COLOR = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
  ? { '재무회계': '#3987e5', '인사노무': '#d95926', '환경': '#199e70', '지식재산권': '#c98500', '공정거래': '#d55181', '안전': '#008300', '지배구조': '#9085e9', '정보보호': '#e66767' }
  : { '재무회계': '#2a78d6', '인사노무': '#eb6834', '환경': '#1baf7a', '지식재산권': '#eda100', '공정거래': '#e87ba4', '안전': '#008300', '지배구조': '#4a3aa7', '정보보호': '#e34948' };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function daysUntil(iso) { return Math.round((new Date(iso + 'T00:00:00+09:00') - TODAY) / 86400000); }
function keyOf(x) { return [x.title, x.effectiveDate, x.amendmentType || ''].join('|'); }
function tierOf(d) { return d < 0 ? 'done' : d <= 7 ? 'urgent' : d <= 30 ? 'soon' : 'later'; }
function expandMini(rows) {
  return (rows || []).map((r, i) => ({
    id: 'ev_' + i, title: r.t, effectiveDate: r.d, popupKey: [r.t || '', r.d || '', r.a || ''].join('|'),
    amendmentType: r.a === '일' ? '일부개정' : (r.a === '타' ? '타법개정' : r.a),
    status: r.s === 0 ? '현행' : '시행예정', ministry: r.m || '', categories: r.c ? [r.c] : [],
    /* efYd(시행일)를 붙여야 그 날 시행되는 본문이 열린다. 없으면 이미 지난 연혁 버전이 열려 '현행법이 아닙니다'가 뜬다. */
    source: { url: r.u ? ('https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=' + r.u + (r.d ? '&efYd=' + String(r.d).replace(/-/g, '') : '')) : '' }
  }));
}
function enrich(items) {
  const by = {};
  items.forEach(it => { (by[it.title] = by[it.title] || []).push(it); });
  Object.values(by).forEach(group => {
    group.sort((a, b) => String(a.effectiveDate || '').localeCompare(String(b.effectiveDate || '')));
    const past = group.filter(g => daysUntil(g.effectiveDate) <= 0).length;
    const timeline = group.map(g => ({ effectiveDate: g.effectiveDate, amendmentType: g.amendmentType || '', status: daysUntil(g.effectiveDate) <= 0 ? '현행' : '시행예정' }));
    group.forEach((g, i) => { g.eventIndex = i + 1; g.eventCount = group.length; g.sameTitlePastCount = past; g.sameTitleUpcomingCount = group.length - past; g.timeline = timeline; });
  });
  items.forEach(it => { it.daysUntil = daysUntil(it.effectiveDate); });
  return items;
}
function ddayBlock(d) {
  if (d < 0) return `<div class="dday"><b>D+${-d}</b><small>시행완료</small></div>`;
  if (d === 0) return `<div class="dday"><b>D-DAY</b><small>오늘 시행</small></div>`;
  const label = d <= 7 ? '긴급' : d <= 30 ? '임박' : '예정';
  return `<div class="dday"><b>D-${d}</b><small>${label}</small></div>`;
}
function timeline(it) {
  const tl = it.timeline || [];
  if (tl.length < 2) return '';
  return `<div class="tl">${tl.map(t => {
    const cls = t.effectiveDate === it.effectiveDate ? 'now' : (t.status === '시행예정' ? 'future' : '');
    return `<span class="${cls}">${esc(t.effectiveDate)} ${esc(t.amendmentType)}</span>`;
  }).join('')}</div>`;
}
function card(it, extra = '') {
  const cat = (it.categories || [])[0];
  const catBadge = cat ? `<span class="badge cat" style="background:${CAT_COLOR[cat] || '#a0aec0'}">${esc(cat)}</span>` : '';
  const multi = it.eventCount > 1 ? `<span class="badge">올해 개정 ${it.eventCount}회 · 시행완료 ${it.sameTitlePastCount} / 예정 ${it.sameTitleUpcomingCount}</span>` : '';
  const keyAttr = it.popupKey ? ` data-key="${esc(it.popupKey)}" tabindex="0" role="button" title="눌러서 개정 내용 보기"` : '';
  return `<article class="card glass ${tierOf(it.daysUntil)}"${keyAttr}>
    <div class="title">${esc(it.title)}</div>
    ${ddayBlock(it.daysUntil)}
    <div class="meta">${esc(it.ministry)} · 시행 ${esc(it.effectiveDate)}</div>
    <div class="rest">
      <div class="badges">${extra}${catBadge}<span class="badge">${esc(it.amendmentType || '')}</span>${amBadges(it)}${multi}</div>
      ${timeline(it)}
    </div>
  </article>`;
}
function section(title, color, list, extra) {
  if (!list.length) return '';
  return `<div class="section-title"><span class="dot" style="--c:${color}"></span>${title}<span class="cnt">${list.length}건</span></div>` +
    list.map(it => card(it, extra)).join('');
}
function diffLists() {
  const nowK = new Set(DATA.items.map(keyOf));
  const prevK = new Set((PREV.items || []).map(keyOf));
  const added = DATA.items.filter(x => !prevK.has(keyOf(x)));
  const removed = enrich((PREV.items || []).filter(x => !nowK.has(keyOf(x))).map(x => Object.assign({}, x)));
  return { added, removed };
}
function render() {
  const q = ($('#q').value || '').trim().toLowerCase();
  const hit = it => (!JOB || (it.categories || [])[0] === JOB) && (!RISK_ONLY || amRisk(it)) &&
    (!q || (it.title + ' ' + (it.ministry || '') + ' ' + (it.categories || []).join(' ')).toLowerCase().includes(q));
  const items = DATA.items.filter(hit);
  let html = '';
  if (TAB === 'd30') {
    const view = items.filter(it => it.daysUntil >= 0 && it.daysUntil <= 30).sort((a, b) => a.daysUntil - b.daysUntil || a.title.localeCompare(b.title));
    html = section('7일 이내 시행 · 긴급', 'var(--urgent)', view.filter(it => it.daysUntil <= 7)) +
           section('8~30일 이내 시행', 'var(--soon)', view.filter(it => it.daysUntil > 7));
  } else if (TAB === 'multi') {
    const view = items.filter(it => (it.eventCount || 1) > 1).sort((a, b) => a.title.localeCompare(b.title) || a.effectiveDate.localeCompare(b.effectiveDate));
    html = view.map(it => card(it)).join('');
  } else if (TAB === 'all') {
    const view = items.slice().sort((a, b) => a.effectiveDate.localeCompare(b.effectiveDate));
    html = section('시행예정', 'var(--later)', view.filter(it => it.daysUntil >= 0)) +
           section('시행완료', 'var(--done)', view.filter(it => it.daysUntil < 0).reverse());
  } else if (TAB === 'diff') {
    const d = diffLists();
    html = section('직전 갱신 이후 새로 잡힌 개정', 'var(--urgent)', d.added.filter(hit), '<span class="badge new">NEW</span>') +
           section('직전 갱신 이후 목록에서 빠진 개정', 'var(--text-muted)', d.removed.filter(hit), '<span class="badge">빠짐</span>');
  }
  $('#list').innerHTML = html || `<div class="empty glass">${TAB === 'diff' ? '직전 갱신 이후 변경이 없습니다.' : '해당하는 법령이 없습니다.'}</div>`;
}
function stats() {
  const items = DATA.items;
  const urgent = items.filter(it => it.daysUntil >= 0 && it.daysUntil <= 7).length;
  const soon = items.filter(it => it.daysUntil > 7 && it.daysUntil <= 30).length;
  const up = items.filter(it => it.daysUntil >= 0).length; /* 오늘 시행분 포함 — 메인의 시행예정과 같은 기준 */
  $('#t-urgent').innerHTML = urgent + (urgent ? '<span class="pulse" title="7일 이내 시행"></span>' : '');
  $('#t-soon').textContent = soon;
  $('#t-later').textContent = up;
  $('#t-all').textContent = items.length;
  const d = diffLists();
  $('#n-d30').textContent = urgent + soon;
  $('#n-multi').textContent = items.filter(it => (it.eventCount || 1) > 1).length;
  $('#n-diff').textContent = d.added.length + d.removed.length;
  $('#n-all').textContent = items.length;
}
/* ---- 직무별 시행예정 분석 (오늘 시행분 포함 = 위 '시행예정 전체'와 같은 기준) ---- */
const CAT_ORDER = ['재무회계', '인사노무', '환경', '지식재산권', '공정거래', '안전', '지배구조', '정보보호'];
const CHARTS = {};
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function jobOf(it) { return (it.categories || [])[0] || '기타'; }
function setJob(j) {
  JOB = (j && j !== JOB) ? j : null;
  const f = $('#jfilter');
  if (JOB) {
    f.innerHTML = `<span class="chip" style="background:${CAT_COLOR[JOB] || '#a0aec0'}">${esc(JOB)}<button type="button" aria-label="직무 선택 해제" title="해제">✕</button></span> 직무만 보는 중`;
    f.querySelector('button').onclick = () => setJob(null);
  } else f.innerHTML = '';
  f.classList.toggle('on', !!JOB);
  document.querySelectorAll('.jr, .lg').forEach(b => b.classList.toggle('on', b.dataset.job === JOB));
  render();
}
function analysis() {
  const up = DATA.items.filter(it => it.daysUntil >= 0);
  const box = $('#an');
  if (!up.length) { box.hidden = true; return; }
  box.hidden = false;
  const by = {};
  up.forEach(it => { (by[jobOf(it)] = by[jobOf(it)] || []).push(it); });
  const jobs = CAT_ORDER.filter(j => by[j]).concat(Object.keys(by).filter(j => !CAT_ORDER.includes(j)));
  const laws = new Set(up.map(it => it.title)).size;
  const maxDay = Math.max.apply(null, up.map(it => it.daysUntil));
  $('#an-total').textContent = up.length;
  $('#an-sub').textContent = `오늘부터 ${up.length}건 (법령 ${laws}개) · 직무 ${jobs.length}개 · 가장 먼 시행 D-${maxDay}`;
  const col = j => CAT_COLOR[j] || '#a0aec0';

  /* 범례 (눌러서 직무 선택) */
  $('#an-legend').innerHTML = jobs.map(j => `<button type="button" class="lg" data-job="${esc(j)}"><i style="background:${col(j)}"></i>${esc(j)}<b>${by[j].length}</b></button>`).join('');

  /* 직무별 긴급도 막대 + 가장 가까운 시행 */
  const max = Math.max.apply(null, jobs.map(j => by[j].length));
  const rows = jobs.slice().sort((a, b) => by[b].length - by[a].length || CAT_ORDER.indexOf(a) - CAT_ORDER.indexOf(b));
  $('#an-rows').innerHTML = rows.map(j => {
    const g = by[j], u = g.filter(x => x.daysUntil <= 7).length, s = g.filter(x => x.daysUntil > 7 && x.daysUntil <= 30).length, l = g.length - u - s;
    const seg = (n, c, t) => n ? `<span style="flex:${n};background:${c}" title="${esc(j)} · ${t} ${n}건"></span>` : '';
    const nx = g.slice().sort((a, b) => a.daysUntil - b.daysUntil)[0];
    const dcls = nx.daysUntil <= 7 ? 'u' : nx.daysUntil <= 30 ? 's' : '';
    const dtx = nx.daysUntil === 0 ? 'D-DAY' : 'D-' + nx.daysUntil;
    return `<button type="button" class="jr" data-job="${esc(j)}" title="${esc(j)} 직무 시행예정만 보기">
      <span class="nm"><i style="background:${col(j)}"></i>${esc(j)}</span>
      <span class="bar" style="width:${Math.max(8, g.length / max * 100)}%">${seg(u, 'var(--urgent)', '7일 이내')}${seg(s, 'var(--soon)', '8~30일')}${seg(l, 'var(--later)', '31일 이후')}</span>
      <span class="n">${g.length}</span>
      <span class="nx" title="${esc(nx.title)} · 시행 ${esc(nx.effectiveDate)}"><b class="${dcls}">${dtx}</b>${esc(nx.title)}</span>
    </button>`;
  }).join('');
  document.querySelectorAll('.jr, .lg').forEach(b => { b.onclick = () => setJob(b.dataset.job); b.classList.toggle('on', b.dataset.job === JOB); });

  if (!window.Chart) return;
  const ink = cssVar('--text-muted') || '#718096', grid = cssVar('--border') || '#e2e8f0', surface = cssVar('--bg-card') || '#fff';
  Chart.defaults.font.family = "'Inter', -apple-system, 'Apple SD Gothic Neo', sans-serif";

  /* 도넛 */
  CHARTS.donut && CHARTS.donut.destroy();
  CHARTS.donut = new Chart($('#c-donut'), {
    type: 'doughnut',
    data: { labels: jobs, datasets: [{ data: jobs.map(j => by[j].length), backgroundColor: jobs.map(col), borderColor: surface, borderWidth: 2, hoverOffset: 4 }] },
    options: {
      maintainAspectRatio: false, cutout: '68%',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label} ${c.raw}건 (${Math.round(c.raw / up.length * 100)}%)` } } },
      onClick: (e, els) => { if (els.length) setJob(jobs[els[0].index]); },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
    }
  });

  /* 월별 x 직무 */
  const months = Array.from(new Set(up.map(it => it.effectiveDate.slice(0, 7)))).sort();
  const y0 = String(TODAY.getFullYear());
  const mlabel = m => (m.slice(0, 4) !== y0 ? m.slice(2, 4) + '년 ' : '') + Number(m.slice(5)) + '월';
  CHARTS.month && CHARTS.month.destroy();
  CHARTS.month = new Chart($('#c-month'), {
    type: 'bar',
    data: {
      labels: months.map(mlabel),
      datasets: jobs.map(j => ({
        label: j, data: months.map(m => by[j].filter(x => x.effectiveDate.slice(0, 7) === m).length),
        backgroundColor: col(j), borderColor: surface, borderWidth: { top: 2 }, borderSkipped: false, borderRadius: 4, maxBarThickness: 56
      }))
    },
    options: {
      maintainAspectRatio: false,
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { color: ink } },
        y: { stacked: true, beginAtZero: true, ticks: { color: ink, precision: 0 }, grid: { color: grid }, border: { display: false } }
      },
      plugins: {
        legend: { position: 'top', align: 'end', labels: { color: ink, boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 3 },
                  onClick: (e, item) => setJob(jobs[item.datasetIndex]) },
        tooltip: { mode: 'index', filter: c => c.raw > 0,
                   callbacks: { footer: cs => '합계 ' + cs.reduce((a, c) => a + c.raw, 0) + '건' } }
      },
      onClick: (e, els) => { if (els.length) setJob(jobs[els[0].datasetIndex]); },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
    }
  });
}
async function loadJSON(url) { const r = await fetch(url + '?v=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error(url); return r.json(); }
async function loadCur() {
  /* upcoming_next.json: 연말에 미리 모아 둔 다음 해 1~2월 시행분 (연초 시행 법령도 D-30 에 잡히도록) */
  const settled = await Promise.allSettled([0, 1, 2, 3, 4, 5, 6, 7].map(i => loadJSON('./m' + i + '.json')).concat([loadJSON('./upcoming_next.json')]));
  let rows = [];
  settled.forEach(s => { if (s.status === 'fulfilled' && Array.isArray(s.value) && s.value[0] && s.value[0].t) rows = rows.concat(s.value); });
  const seen = {};
  rows = rows.filter(r => { const k = (r.t || '') + '|' + (r.d || '') + '|' + (r.a || ''); if (seen[k]) return false; seen[k] = 1; return true; });
  if (rows.length) return { items: expandMini(rows) };
  const data = await loadJSON('./index.json');
  return Array.isArray(data) ? { items: data } : data;
}
Promise.all([
  loadCur(),
  loadJSON('./previous_index.json').catch(() => ({ items: [] })),
  loadJSON('./meta.json').catch(() => ({}))
]).then(([cur, prev, meta]) => {
  DATA = cur;
  PREV = Array.isArray(prev) ? { items: prev } : prev;
  DATA.items = enrich(DATA.items || []);
  const today = TODAY.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
  const upd = meta.generatedAt ? ' · 데이터 ' + new Date(meta.generatedAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' 갱신' : '';
  $('#asof').textContent = '오늘(' + today + ') 기준 남은 날' + upd;
  stats();
  analysis();
  render();
}).catch(e => { $('#asof').textContent = '데이터를 불러오지 못했습니다.'; console.error(e); });
document.querySelectorAll('.tab').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === btn));
  TAB = btn.dataset.tab;
  render();
});
$('#q').addEventListener('input', render);
$('#risk-only').addEventListener('click', () => {
  RISK_ONLY = !RISK_ONLY;
  $('#risk-only').setAttribute('aria-pressed', String(RISK_ONLY));
  render();
});
loadJSON('./amend_flags.json').then(j => { AMEND = (j && j.items) || {}; render(); }).catch(() => {});

/* ---- 법령 상세 팝업: 메인(분기별 탭)과 똑같은 팝업을 띄운다 ---- */
const popup = document.createElement('iframe');
popup.id = 'rr-popup';
popup.title = '법령 상세';
if (!window.RR_EMBEDDED) { popup.src = './?desktop=true&embed=popup'; document.body.appendChild(popup); }
function openPopup(key) {
  if (window.RR_EMBEDDED) { window.parent.postMessage({ rr: 'open-law', key: key }, location.origin); return; }
  document.body.classList.add('rr-loading');
  popup.classList.add('open');
  popup.contentWindow.postMessage({ rr: 'open', key }, location.origin);
}
window.addEventListener('message', ev => {
  if (ev.origin !== location.origin || ev.source !== popup.contentWindow || !ev.data) return;
  if (ev.data.rr === 'closed') { popup.classList.remove('open'); document.body.classList.remove('rr-loading'); }
});
popup.addEventListener('load', () => {
  /* 팝업이 실제로 열리면 로딩 커서를 끈다 */
  try {
    const m = popup.contentDocument.getElementById('law-modal');
    if (m) new MutationObserver(() => { if (m.classList.contains('show')) document.body.classList.remove('rr-loading'); })
      .observe(m, { attributes: true, attributeFilter: ['class'] });
  } catch (e) {}
});
$('#list').addEventListener('click', ev => {
  const card = ev.target.closest('.card[data-key]');
  if (card) openPopup(card.dataset.key);
});
$('#list').addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const card = ev.target.closest('.card[data-key]');
  if (card) { ev.preventDefault(); openPopup(card.dataset.key); }
});
</script>
<script>
  /* 끼워 넣어진 경우: 내용 높이가 바뀔 때마다 메인에 알린다 */
  (function () {
    if (!window.RR_EMBEDDED) return;
    var last = 0;
    function report() {
      /* 문서 전체 높이(=iframe 높이 이상)가 아니라 내용 높이를 잰다 — 내용이 줄면 iframe 도 줄어들게 */
      var h = Math.ceil(document.body.getBoundingClientRect().height) + 24;
      if (Math.abs(h - last) > 2) { last = h; window.parent.postMessage({ rr: 'embed-height', h: h }, location.origin); }
    }
    if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
    window.addEventListener('load', report);
    setInterval(report, 1000);
    /* 사이트 안 다른 페이지로 가는 링크는 메인의 해당 탭으로 바꾼다 */
    var TAB = { 'history.html': 'history', 'watch.html': 'watch', '': 'overview', 'index.html': 'overview' };
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a || a.target === '_blank') return;
      var u = new URL(a.href, location.href);
      if (u.origin !== location.origin) return;
      var name = u.pathname.split('/').pop();
      if (TAB[name] == null) return;
      e.preventDefault();
      window.parent.postMessage({ rr: 'go-tab', tab: TAB[name] }, location.origin);
    });
  })();
</script>
