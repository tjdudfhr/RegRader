<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RegRader Watch</title>
<style>
:root{--bg:#0f1419;--card:#1a222c;--line:#2b3642;--text:#e8eef4;--muted:#93a4b3;--ok:#3dd68c;--warn:#ffb020;--hot:#ff6b6b;--blue:#4da3ff;--chip:#243040;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}header{padding:18px 16px 8px}h1{font-size:1.25rem;margin:0 0 6px}.sub{color:var(--muted);font-size:.86rem}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px 16px 16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:1.35rem}nav{display:flex;gap:6px;padding:0 16px 12px;position:sticky;top:0;background:var(--bg);z-index:2}nav button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px;font-size:.82rem}nav button.on{background:#2a5d9a;border-color:#3b7ac0}.list{padding:0 16px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}.title{font-weight:700;margin:0 0 6px}.meta{font-size:.8rem;color:var(--muted)}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.badge{font-size:.72rem;padding:3px 8px;border-radius:999px;background:var(--chip)}.badge.hot{background:#5a2020;color:#ffd0d0}.badge.warn{background:#5a4314;color:#ffe2a3}.badge.ok{background:#1c4a34;color:#b9f5d4}.tl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tl span{font-size:.72rem;border:1px solid var(--line);border-radius:8px;padding:3px 6px;color:var(--muted)}.tl span.now{border-color:#4da3ff;color:#cfe6ff}.tl span.future{border-color:#ffb020;color:#ffe2a3}.search{margin:0 16px 12px;width:calc(100%-32px);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#121820;color:var(--text)}a{color:var(--blue)}.empty{color:var(--muted);padding:24px;text-align:center}
</style></head><body>
<header><h1>RegRader Watch</h1><div class="sub" id="asof">데이터 로딩 중…</div></header>
<div class="stats" id="stats"></div>
<nav>
<button class="on" data-tab="d30">D-30 임박</button>
<button data-tab="multi">복수개정</button>
<button data-tab="diff">변경감지</button>
<button data-tab="all">전체</button>
</nav>
<input class="search" id="q" placeholder="법령명 / 부처 검색">
<div class="list" id="list"></div>
<script>
const TODAY=(()=>{const k=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));return new Date(k.getFullYear(),k.getMonth(),k.getDate());})();
let DATA={items:[]},PREV={items:[]},TAB='d30';
const $=s=>document.querySelector(s);
function daysUntil(iso){return Math.round((new Date(iso+'T00:00:00+09:00')-TODAY)/86400000)}
function keyOf(x){return [x.title,x.effectiveDate,x.amendmentType||''].join('|')}
function expandMini(rows){return (rows||[]).map((r,i)=>({id:'ev_'+i,title:r.t,effectiveDate:r.d,amendmentType:r.a==='일'?'일부개정':(r.a==='타'?'타법개정':r.a),status:r.s===0?'현행':'시행예정',ministry:r.m||'',categories:r.c?[r.c]:[],source:{url:r.u?('https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq='+r.u):''}}))}
function enrich(items){const by={};items.forEach(it=>{(by[it.title]=by[it.title]||[]).push(it)});Object.values(by).forEach(group=>{group.sort((a,b)=>String(a.effectiveDate||'').localeCompare(String(b.effectiveDate||'')));const past=group.filter(g=>daysUntil(g.effectiveDate)<=0).length;const timeline=group.map(g=>({effectiveDate:g.effectiveDate,amendmentType:g.amendmentType||'',status:daysUntil(g.effectiveDate)<=0?'현행':'시행예정'}));group.forEach((g,i)=>{g.eventIndex=i+1;g.eventCount=group.length;g.sameTitlePastCount=past;g.sameTitleUpcomingCount=group.length-past;g.timeline=timeline;});});return items;}
function badgeStatus(it){const d=it.daysUntil??daysUntil(it.effectiveDate);if(d<0)return `<span class="badge ok">시행완료 D+${Math.abs(d)}</span>`;if(d===0)return `<span class="badge hot">오늘 시행</span>`;if(d<=7)return `<span class="badge hot">D-${d} 긴급</span>`;if(d<=30)return `<span class="badge warn">D-${d} 임박</span>`;return `<span class="badge">D-${d} 예정</span>`;}
function timeline(it){const tl=it.timeline||[];if(!tl.length)return '';return `<div class="tl">${tl.map(t=>{const cls=t.effectiveDate===it.effectiveDate?'now':(t.status==='시행예정'?'future':'');return `<span class="${cls}">${t.effectiveDate} ${t.amendmentType||''}</span>`}).join('')}</div>`}
function card(it,extra=''){const url=(it.source&&it.source.url)||'';return `<article class="card"><div class="title">${it.title}</div><div class="meta">${it.ministry||''} · ${(it.categories||[]).join(', ')}</div><div class="badges">${badgeStatus(it)}<span class="badge">${it.amendmentType||''}</span>${it.eventCount>1?`<span class="badge">오해 ${it.eventCount}회 개정 · 완료 ${it.sameTitlePastCount} / 예정 ${it.sameTitleUpcomingCount}</span>`:''}${extra}</div>${timeline(it)}${url?`<div class="meta" style="margin-top:8px"><a href="${url}" target="_blank" rel="noopener">법령 원문</a></div>`:''}</article>`}
function render(){const q=($('#q').value||'').trim();let items=DATA.items.slice();items.forEach(it=>it.daysUntil=daysUntil(it.effectiveDate));if(q)items=items.filter(it=>(it.title+(it.ministry||'')+(it.categories||[]).join('')).includes(q));let view=items;if(TAB==='d30')view=items.filter(it=>it.daysUntil>=0&&it.daysUntil<=30).sort((a,b)=>a.daysUntil-b.daysUntil);if(TAB==='multi')view=items.filter(it=>(it.eventCount||1)>1).sort((a,b)=>(b.eventCount-a.eventCount)||a.title.localeCompare(b.title,'ko')||a.effectiveDate.localeCompare(b.effectiveDate));if(TAB==='all')view=items.sort((a,b)=>a.effectiveDate.localeCompare(b.effectiveDate));if(TAB==='diff'){const nowK=new Set(DATA.items.map(keyOf));const prevK=new Set((PREV.items||[]).map(keyOf));const added=DATA.items.filter(x=>!prevK.has(keyOf(x)));const removed=(PREV.items||[]).filter(x=>!nowK.has(keyOf(x)));$('#list').innerHTML=`<div class="sub" style="margin:0 0 10px">신규 ${added.length}건 · 이전 스냅샷에만 있던 건 ${removed.length}건</div>`+added.map(it=>card(it,'<span class="badge hot">NEW</span>')).join('')+removed.map(it=>card(Object.assign({daysUntil:daysUntil(it.effectiveDate)},it),'<span class="badge">이전만 존재</span>')).join('')||'<div class="empty">변경 없음</div>';return;}$('#list').innerHTML=view.map(it=>card(it)).join('')||'<div class="empty">해당 항목 없음</div>';}
function stats(){const items=DATA.items;const d30=items.filter(it=>{const d=daysUntil(it.effectiveDate);return d>=0&&d<=30}).length;const up=items.filter(it=>daysUntil(it.effectiveDate)>0).length;const done=items.filter(it=>daysUntil(it.effectiveDate)<=0).length;const both=new Set(items.filter(it=>(it.sameTitlePastCount||0)>0&&(it.sameTitleUpcomingCount||0)>0).map(it=>it.title)).size;$('#stats').innerHTML=`<div class="stat"><b>${items.length}</b><span class="sub">2026 개정 이벤트</span></div><div class="stat"><b>${d30}</b><span class="sub">D-30 이내</span></div><div class="stat"><b>${up}</b><span class="sub">시행예정</span></div><div class="stat"><b>${both}</b><span class="sub">이미 시행+추가예정 법령</span></div>`;$('#asof').textContent=`기준일 2026-09-15 · 같은 법령의 여러 개정은 시행일별로 따로 집계 · 완료 ${done} / 예정 ${up}`;}
async function loadCur(){try{const r=await fetch('./events_mini.json?v='+Date.now(),{cache:'no-store'});if(r.ok){const rows=await r.json();if(Array.isArray(rows)&&rows.length&&rows[0].t)return {items:expandMini(rows),asOf:'2026-09-15'};}}catch(e){}const r2=await fetch('./index.json?v='+Date.now(),{cache:'no-store'});const data=await r2.json();return Array.isArray(data)?{items:data}:data;}
Promise.all([loadCur(),fetch('./previous_index.json?v='+Date.now()).then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]}))]).then(([cur,prev])=>{DATA=cur;PREV=Array.isArray(prev)?{items:prev}:prev;DATA.items=enrich(DATA.items||[]);stats();render();}).catch(err=>{$('#asof').textContent='로드 실패: '+err});
document.querySelectorAll('nav button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');TAB=btn.dataset.tab;render()});
$('#q').addEventListener('input',render);
</script></body></html>
