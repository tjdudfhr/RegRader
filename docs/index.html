<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RegRader</title>
</head>
<body>
  <div id="boot">화면을 불러오는 중입니다...</div>
  <script>
  (async function () {
    var END = '<' + '/body>';
    var TAGS = '<script src="./event-boot.js?v=20260915t"><' + '/script>' +
               '<script src="./why-core.js?v=20260915t"><' + '/script>' +
               '<script src="./sum-fill.js?v=20260915t"><' + '/script>' +
               '<script src="./brief-ui.js?v=20260915t"><' + '/script>' +
               '<script src="./stats-ui.js?v=20260915t"><' + '/script>' +
               '<script src="./registry-fix.js?v=20260915t"><' + '/script>' +
               '<script src="./download-ui.js?v=20260915t"><' + '/script>';
    try {
      if ('serviceWorker' in navigator) {
        var regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function (r) { return r.unregister(); }));
        if (window.caches) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
      }
    } catch (e0) {}
    var src = 'https://raw.githubusercontent.com/tjdudfhr/RegRader/bcd307684f9a8a93679fe8bbac594ba87314a36a/docs/index.html?v=20260915t';
    var res = await fetch(src, { cache: 'no-store' });
    var html = await res.text();
    html = html.replace(END, TAGS + END);
    document.open(); document.write(html); document.close();
  })();
  </script>
</body>
</html>
